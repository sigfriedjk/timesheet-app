name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare and check site artifact
        run: |
          rm -rf _site
          mkdir _site
          for file in index.html unlock.js payload.json; do
            if [[ ! -f "$file" || -L "$file" ]]; then
              echo "Missing or unsafe site file: $file" >&2
              exit 1
            fi
            cp -- "$file" "_site/$file"
          done
          test "$(find _site -type f | wc -l)" -eq 3
          node -e 'const p=require("./_site/payload.json"); if (p.version !== 1 || typeof p.data !== "string" || Object.keys(p).sort().join(",") !== "data,iterations,iv,salt,version") process.exit(1)'

      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
